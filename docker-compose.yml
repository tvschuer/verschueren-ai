services:
  verschueren-ai:
    image: ghcr.io/tvschuer/verschueren-ai:latest
    container_name: verschueren-ai
    restart: unless-stopped
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/privacy"]
      interval: 60s
      timeout: 5s
      retries: 3
