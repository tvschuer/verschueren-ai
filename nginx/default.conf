server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nette URL's: /privacy -> privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Geen directory listings, geen etags met inode-info
    autoindex off;

    # De site is statisch en bevat geen secrets; laat crawlers gewoon indexeren.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # OAuth-branding URLs moeten altijd vers en bereikbaar zijn.
    location ~* \.(css|html)$ {
        add_header Cache-Control "public, max-age=300";
    }

    error_page 404 /index.html;
}
